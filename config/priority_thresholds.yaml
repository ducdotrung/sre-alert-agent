# Priority scoring thresholds
# Used by Triage Agent for rule-based priority assignment

# Priority levels: P0 (critical), P1 (high), P2 (medium), P3 (low)

# Base thresholds by class
class_thresholds:
  client-disconnect:
    P0: { count: 999999, users: 999999 }  # Never P0
    P1: { count: 999999, users: 999999 }  # Never P1
    P2: { count: 2000, users: 100 }
    P3: { count: 0, users: 0 }  # Default

  availability:
    P0: { count: 1000, users: 50 }
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

  dependency:
    P0: { count: 500, users: 20 }
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

  performance-timeout:
    P0: { count: 500, users: 20 }
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

  auth-permission:
    P0: { count: 999999, users: 999999 }  # Rarely P0
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

  data-integrity:
    P0: { count: 999999, users: 999999 }  # Rarely P0
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

  input-validation:
    P0: { count: 999999, users: 999999 }  # Never P0
    P1: { count: 999999, users: 999999 }  # Never P1
    P2: { count: 100, users: 10 }
    P3: { count: 0, users: 0 }

  frontend-client:
    P0: { count: 999999, users: 999999 }  # Never P0
    P1: { count: 999999, users: 999999 }  # Never P1
    P2: { count: 100, users: 10 }
    P3: { count: 0, users: 0 }

  unknown:
    P0: { count: 1000, users: 50 }
    P1: { count: 100, users: 10 }
    P2: { count: 50, users: 5 }
    P3: { count: 0, users: 0 }

# Fatal level always bumps priority
fatal_bump: true  # If level=fatal, increase priority by 1 level

# Confidence scores for rule-based classification
confidence:
  exact_keyword_match: 0.9  # Exact keyword found
  multiple_keywords: 0.85   # Multiple keywords match
  single_keyword: 0.7       # Single keyword match
  no_match: 0.3             # No keywords, guessing based on thresholds
