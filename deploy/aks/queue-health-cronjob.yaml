apiVersion: batch/v1
kind: CronJob
metadata:
  name: sre-alert-queue-health
spec:
  schedule: "*/10 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
          containers:
            - name: queue-health
              image: ghcr.io/example/sre-alert-agent:1.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -lc
                - python3 scripts/check_queue_health.py --config "${CONFIG_FILE}"
              envFrom:
                - configMapRef:
                    name: sre-alert-agent-config
                - secretRef:
                    name: sre-alert-agent-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: output
                  mountPath: /app/output
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: sre-alert-agent-output
